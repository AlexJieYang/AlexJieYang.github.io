<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.home %}{{ site.title | escape }} · Science of Science{% else %}{{ page.title | escape }} · {{ site.title | escape }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_US">
    <meta property="og:site_name" content="{{ site.title | escape }}">
    <meta property="og:title" content="{{ page.title | escape }} · {{ site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/images/profile.jpg' | absolute_url }}">
    <meta property="og:image:width" content="1365">
    <meta property="og:image:height" content="2047">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#f8f7f3">
    <link rel="icon" type="image/svg+xml" href="{{ '/images/monogram.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <script src="{{ '/assets/js/academic.js' | relative_url }}" defer></script>
    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"Person","name":{{ site.data.profile.name | jsonify }},"alternateName":{{ site.data.profile.chinese_name | jsonify }},"url":{{ '/' | absolute_url | jsonify }},"image":{{ '/images/profile.jpg' | absolute_url | jsonify }},"affiliation":{"@type":"CollegeOrUniversity","name":{{ site.data.profile.institution | jsonify }}},"sameAs":[{{ site.data.profile.official_homepage | jsonify }},{{ site.data.profile.github | jsonify }},{{ site.data.profile.researchgate | jsonify }},"https://orcid.org/{{ site.data.profile.orcid }}"],"knowsAbout":["Science of science","Network science","Scientific innovation","Computational social science"]}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include academic/header.html %}
    <main id="main-content" class="site-main" tabindex="-1">{{ content }}</main>
    {% include academic/footer.html %}
  </body>
</html>
