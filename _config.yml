# Personal academic site; compatible with GitHub Pages.
title: "Alex Jie Yang (杨杰)"
name: "Alex Jie Yang"
description: "Alex Jie Yang studies science of science, scientific innovation, research teams, and knowledge networks at Nanjing University."
url: "https://alexjieyang.github.io"
baseurl: ""
repository: "AlexJieYang/AlexJieYang.github.io"
locale: "en-US"
timezone: "Asia/Shanghai"
encoding: "utf-8"
future: true

include:
  - _pages
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - node_modules
  - vendor
  - tmp
  - tools

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
